name: Audit eligible card identities

on:
  workflow_dispatch:

jobs:
  audit:
    name: Read-only card identity audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
          pip install -r crawler/requirements.txt pytesseract pillow
      - name: Run read-only audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python audit_card_identity_all.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: eligible-card-identity-audit
          path: crawler/seeds/_audit_out/card_identity_all.json
