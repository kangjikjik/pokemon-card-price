name: Replace nonofficial card images

on:
  workflow_dispatch:

jobs:
  replace:
    name: Replace nonofficial DB images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Replace nonofficial image URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python replace_nonofficial_card_images.py

      - name: Upload replacement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonofficial-card-image-replacement
          path: crawler/seeds/_audit_out/nonofficial_card_image_replacement.json
          if-no-files-found: ignore
