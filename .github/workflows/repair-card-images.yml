name: Repair card images from official site

on:
  workflow_dispatch:

jobs:
  repair:
    name: Verify and repair KR card images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Apply official image and name corrections
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python fix_unpriced_card_identity.py

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-card-image-repair-report
          path: crawler/seeds/_audit_out/official_identity_apply_latest.json
          if-no-files-found: ignore
