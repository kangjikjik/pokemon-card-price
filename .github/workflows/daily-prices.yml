# 일일 전 팩 시세 크롤 — GitHub Actions (수동 실행 전용)
# collectory / yuyutei 가 클라우드 IP(403)를 차단하므로 cron 비활성화.
# 일일 자동 실행: Windows 작업 PokemonCardPrice-DailyBatch (로컬 PC)
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, COLLECTORY_COOKIE (선택)

name: Daily price batch

on:
  workflow_dispatch:
  # schedule disabled — cloud runners get 403 from collectory/yuyutei
  # - cron: "0 15 * * *"

concurrency:
  group: daily-price-crawl
  cancel-in-progress: false

jobs:
  kr:
    name: KR all 79 sets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Validate Supabase env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler/scripts/sync_github_secrets.py --check-only

      - name: Crawl KR all sets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COLLECTORY_COOKIE: ${{ secrets.COLLECTORY_COOKIE }}
        working-directory: crawler/seeds
        run: python crawl_prices_batch.py --apply --daily --all

  jp:
    name: JP all 79 sets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Validate Supabase env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler/scripts/sync_github_secrets.py --check-only

      - name: Crawl JP all sets in groups of five
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python crawl_prices_batch_jp.py --apply --all --size 5 --pause 60
