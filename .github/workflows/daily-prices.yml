# 전팩 시세 크롤 — GitHub Actions
# 번개장터 전용 (Collectory · 유유테이 제거 → 클라우드 IP 차단 없음)
#
# 자동 실행은 4일 간격: 매월 1, 5, 9, 13, 17, 21, 25, 29일 KST 00:00 (UTC 15:00)
# catch-up이 마지막 크롤 다음날~오늘을 채운다. 기준: crawler/TRADE_CRAWL_CRITERIA.md §15
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, EXCHANGE_RATE_API_KEY (선택)

name: Daily price batch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 */4 * *"   # UTC 15:00 = KST 00:00, 매월 1·5·9·13·17·21·25·29일

concurrency:
  group: daily-price-crawl
  cancel-in-progress: false

jobs:

  # ─── 0. 180일 초과 상세 행 정리 (TRADE §11) ─────────────────
  purge-stale:
    name: Purge stale trade details
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Purge 180d+ detail rows + SNKRDUNK legacy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python purge_stale_trade_details.py --apply

      - name: Reconcile listing→sold duplicate PIDs (§13)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python reconcile_listing_to_sold.py --apply

  # ─── 1. KR 카드 시세 ─────────────────────────────────────
  kr-cards:
    name: KR cards (82 sets)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: purge-stale

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Validate Supabase env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler/scripts/sync_github_secrets.py --check-only

      - name: Crawl KR cards (all 82 sets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python crawl_prices_batch.py --apply --daily --all --catch-up

  # ─── 2. JP 카드 시세 ─────────────────────────────────────
  jp-cards:
    name: JP cards (82 sets)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: purge-stale

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Validate Supabase env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler/scripts/sync_github_secrets.py --check-only

      - name: Crawl JP cards (all 82 sets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        working-directory: crawler/seeds
        run: python crawl_prices_batch_jp.py --apply --all --catch-up

  # ─── 3. KR 박스 시세 ─────────────────────────────────────
  kr-boxes:
    name: KR box prices (82 sets)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: kr-cards

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Crawl KR boxes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python crawl_box_prices_batch.py --apply --all --catch-up

  # ─── 4. JP 박스 시세 ─────────────────────────────────────
  jp-boxes:
    name: JP box prices (82 sets)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: jp-cards

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Crawl JP boxes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python crawl_box_prices_batch.py --apply --all --region JP --catch-up

  # ─── 5. 홈 핫카드·급상승·주요 세트 (조회수) ──────────────
  home-highlights:
    name: Home highlights from views
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [kr-boxes, jp-boxes]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Update home card and set order
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python update_home_highlights.py --apply
