# 일일 전 팩 시세 크롤 (KR 79팩 + JP 79팩) — GitHub Actions
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, COLLECTORY_COOKIE (선택)
# repo Settings > Actions 활성화 후 cron 동작

name: Daily price batch

on:
  workflow_dispatch:
  schedule:
    # UTC 15:00 = KST 00:00 (자정)
    - cron: "0 15 * * *"

concurrency:
  group: daily-price-crawl
  cancel-in-progress: false

jobs:
  kr:
    name: KR all 79 sets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Crawl KR all sets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COLLECTORY_COOKIE: ${{ secrets.COLLECTORY_COOKIE }}
        working-directory: crawler/seeds
        run: python crawl_prices_batch.py --apply --daily --all

  jp:
    name: JP all 79 sets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Crawl JP all sets in groups of five
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python crawl_prices_batch_jp.py --apply --all --size 5 --pause 60
