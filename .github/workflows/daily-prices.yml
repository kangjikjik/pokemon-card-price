# 일일 전팩 시세 크롤 — GitHub Actions
# 번개장터 전용 (Collectory · 유유테이 제거 → 클라우드 IP 차단 없음)
#
# KST 00:00 (UTC 15:00) 매일 자동 실행 + 수동 실행(workflow_dispatch)
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, EXCHANGE_RATE_API_KEY (선택)

name: Daily price batch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"   # UTC 15:00 = KST 00:00

concurrency:
  group: daily-price-crawl
  cancel-in-progress: false

jobs:

  # ─── 1. KR 카드 시세 ─────────────────────────────────────
  kr-cards:
    name: KR cards (82 sets)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Validate Supabase env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler/scripts/sync_github_secrets.py --check-only

      - name: Crawl KR cards (all 82 sets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python crawl_prices_batch.py --apply --daily --all --previous-day

  # ─── 2. JP 카드 시세 ─────────────────────────────────────
  jp-cards:
    name: JP cards (82 sets)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Validate Supabase env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler/scripts/sync_github_secrets.py --check-only

      - name: Crawl JP cards (all 82 sets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        working-directory: crawler/seeds
        run: python crawl_prices_batch_jp.py --apply --all --previous-day

  # ─── 3. KR 박스 시세 ─────────────────────────────────────
  kr-boxes:
    name: KR box prices (82 sets)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: kr-cards

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Crawl KR boxes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python crawl_box_prices_batch.py --apply --all --previous-day

  # ─── 4. JP 박스 시세 ─────────────────────────────────────
  jp-boxes:
    name: JP box prices (82 sets)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: jp-cards

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r crawler/requirements.txt

      - name: Crawl JP boxes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python crawl_box_prices_batch.py --apply --all --region JP --previous-day
