name: Repair Korean card grade images from Collectory

on:
  workflow_dispatch:

jobs:
  repair:
    name: Repair verified Korean card images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
          pip install -r crawler/requirements.txt pytesseract pillow
      - name: Repair verified mismatches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: crawler/seeds
        run: python repair_collectory_kr_grade_images.py
      - name: Upload repair report
        uses: actions/upload-artifact@v4
        with:
          name: collectory-kr-grade-repair
          path: crawler/seeds/_audit_out/collectory_kr_grade_repair.json
